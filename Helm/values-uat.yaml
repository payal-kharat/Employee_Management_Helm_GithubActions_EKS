
components:
  frontend:
    enabled: true
    deploymentName: frontend
    replicas: 1
    image: ""
    tag: ""
    containerPort: 80
    service:
      enabled: true
      name: frontend-service
      type: ClusterIP
      port: 80
    env: []

  backend:
    enabled: true
    deploymentName: backend
    replicas: 1
    image: ""
    tag: ""
    containerPort: 5000
    service:
      enabled: true
      name: backend
      type: ClusterIP
      port: 5000
    env:
      - name: DB_HOST
        valueFrom:
          configMapKeyRef:
            name: employee-cm
            key: DB_HOST
      - name: DB_PORT
        valueFrom:
          configMapKeyRef:
            name: employee-cm
            key: DB_PORT
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_USER
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_PASSWORD
      - name: DB_NAME
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_DATABASE

  mysql:
    enabled: true
    deploymentName: mysql
    replicas: 1
    image: ""
    tag: ""
    containerPort: 3306
    persistence:
      existingClaim: mysql-pvc
      size: 2Gi
    service:
      enabled: true
      name: mysql
      type: ClusterIP
      port: 3306
    env:
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_ROOT_PASSWORD
      - name: MYSQL_DATABASE
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_DATABASE
      - name: MYSQL_USER
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_USER
      - name: MYSQL_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            key: MYSQL_PASSWORD

configMap:
  enabled: true
  name: employee-cm
  data:
    DB_HOST: mysql
    DB_PORT: "3306"

secret:
  enabled: true
  name: mysql-secret
  stringData:
    MYSQL_ROOT_PASSWORD: ""
    MYSQL_DATABASE: ""
    MYSQL_USER: ""
    MYSQL_PASSWORD: ""

storageClass:
  enabled: true
  name: ebs-gp3
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  parameters:
    type: gp3
    fsType: ext4

ingress:
  enabled: true
  name: employee-management-ingress
  className: alb
  scheme: internet-facing
  targetType: ip
  host: employee-uat.com
