
{{- $mysql := .Values.components.mysql | default dict }}
{{- $persistence := $mysql.persistence | default dict }}
{{- if $mysql.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ required "components.mysql.persistence.existingClaim is required" $persistence.existingClaim }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ required "storageClass.name is required" .Values.storageClass.name }}
  resources:
    requests:
      storage: {{ required "components.mysql.persistence.size is required" $persistence.size | quote }}
{{- end }}
