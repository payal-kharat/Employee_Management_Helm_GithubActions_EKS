
name: Employee Management DB Pipeline

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: Deployment Environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
          - uat
          - prod
      image_tag:
        description: Original DEV image tag for QA, UAT or PROD (example DEV-b625074)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "020048087135"
  EKS_CLUSTER: employee-mgm-dev-cluster
  ECR_REGISTRY: 020048087135.dkr.ecr.us-east-1.amazonaws.com
  DEPLOY_ENV: ${{ inputs.deploy_env }}
  NAMESPACE: ${{ inputs.deploy_env }}
  ECR_REPOSITORY: employee-mgm-${{ inputs.deploy_env }}-db
  HELM_RELEASE: employee-management-db
  HELM_CHART: ./Helm
  VALUES_FILE: ./Helm/values-${{ inputs.deploy_env }}.yaml
  DOCKERFILE_PATH: ./db/Dockerfile
  DOCKER_BUILD_CONTEXT: ./db
  STORAGE_CLASS_NAME: ebs-gp3

jobs:
  build-dev:
    if: ${{ inputs.deploy_env == 'dev' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required Tools
        run: |
          docker --version
          aws --version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate DEV Image Tag
        id: image
        run: |
          IMAGE_TAG="DEV-${GITHUB_SHA::7}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building image: $IMAGE_TAG"

      - name: Build and Push DEV DB Image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" >/dev/null

          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            "$DOCKER_BUILD_CONTEXT"

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  promote-image:
    if: ${{ inputs.deploy_env != 'dev' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.promote.outputs.image_tag }}
    steps:
      - name: Validate DEV Image Tag
        env:
          SOURCE_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -z "$SOURCE_IMAGE_TAG" ]]; then
            echo "::error::Provide the original DEV image tag, for example DEV-b625074."
            exit 1
          fi

          if [[ ! "$SOURCE_IMAGE_TAG" =~ ^DEV-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid DEV image tag: $SOURCE_IMAGE_TAG"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Promote Existing DEV Image
        id: promote
        env:
          SOURCE_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          aws ecr describe-images \
            --repository-name employee-mgm-dev-db \
            --image-ids imageTag="$SOURCE_IMAGE_TAG" >/dev/null

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" >/dev/null

          SUFFIX="${SOURCE_IMAGE_TAG#DEV-}"
          TARGET_IMAGE_TAG="${DEPLOY_ENV^^}-${SUFFIX}"

          SOURCE_IMAGE="$ECR_REGISTRY/employee-mgm-dev-db:$SOURCE_IMAGE_TAG"
          TARGET_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$TARGET_IMAGE_TAG"

          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

          echo "image_tag=$TARGET_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Promoted $SOURCE_IMAGE_TAG to $TARGET_IMAGE_TAG"

  deploy-db:
    needs:
      - build-dev
      - promote-image
    if: >-
      always() &&
      (
        (inputs.deploy_env == 'dev' && needs.build-dev.result == 'success') ||
        (inputs.deploy_env != 'dev' && needs.promote-image.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_env }}
    env:
      IMAGE_TAG: ${{ inputs.deploy_env == 'dev' && needs.build-dev.outputs.image_tag || needs.promote-image.outputs.image_tag }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required Tools
        run: |
          aws --version
          kubectl version --client
          helm version
          docker --version

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure EKS Access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          kubectl cluster-info
          kubectl get nodes

      - name: Validate Database Secrets
        run: |
          if [[ -z "$MYSQL_ROOT_PASSWORD" || \
                -z "$MYSQL_USER" || \
                -z "$MYSQL_PASSWORD" || \
                -z "$MYSQL_DATABASE" ]]; then
            echo "::error::One or more required MySQL GitHub Secrets are missing."
            exit 1
          fi

      - name: Prepare Database Secret Files
        run: |
          SECRET_DIR="$(mktemp -d)"
          chmod 700 "$SECRET_DIR"

          printf '%s' "$MYSQL_ROOT_PASSWORD" > "$SECRET_DIR/MYSQL_ROOT_PASSWORD"
          printf '%s' "$MYSQL_USER" > "$SECRET_DIR/MYSQL_USER"
          printf '%s' "$MYSQL_PASSWORD" > "$SECRET_DIR/MYSQL_PASSWORD"
          printf '%s' "$MYSQL_DATABASE" > "$SECRET_DIR/MYSQL_DATABASE"

          chmod 600 "$SECRET_DIR"/*
          echo "SECRET_DIR=$SECRET_DIR" >> "$GITHUB_ENV"

      - name: Create Namespace
        run: |
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure StorageClass Management
        id: storage
        run: |
          if kubectl get storageclass "$STORAGE_CLASS_NAME" >/dev/null 2>&1; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Existing $STORAGE_CLASS_NAME StorageClass will be reused."
          else
            echo "::error::StorageClass $STORAGE_CLASS_NAME does not exist. Create it separately before deploying the database."
            exit 1
          fi

      - name: Validate Helm Chart and Values
        run: |
          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "::error::Values file not found: $VALUES_FILE"
            exit 1
          fi

          if [[ ! -d "$HELM_CHART/templates" ]]; then
            echo "::error::Helm templates directory not found."
            exit 1
          fi

          helm lint "$HELM_CHART" -f "$VALUES_FILE"

      - name: Deploy Database with Helm
        env:
          STORAGE_CLASS_ENABLED: ${{ steps.storage.outputs.enabled }}
        run: |
          if ! helm upgrade --install "$HELM_RELEASE" "$HELM_CHART" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$VALUES_FILE" \
            --set-string components.mysql.image="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set-string components.mysql.tag="$IMAGE_TAG" \
            --set components.mysql.enabled=true \
            --set components.mysql.service.enabled=true \
            --set components.frontend.enabled=false \
            --set components.backend.enabled=false \
            --set ingress.enabled=false \
            --set configMap.enabled=true \
            --set secret.enabled=true \
            --set storageClass.enabled="$STORAGE_CLASS_ENABLED" \
            --set-file secret.stringData.MYSQL_ROOT_PASSWORD="$SECRET_DIR/MYSQL_ROOT_PASSWORD" \
            --set-file secret.stringData.MYSQL_USER="$SECRET_DIR/MYSQL_USER" \
            --set-file secret.stringData.MYSQL_PASSWORD="$SECRET_DIR/MYSQL_PASSWORD" \
            --set-file secret.stringData.MYSQL_DATABASE="$SECRET_DIR/MYSQL_DATABASE" \
            --wait \
            --timeout 10m; then
            echo "::error::Helm database deployment failed in namespace $NAMESPACE."
            helm status "$HELM_RELEASE" -n "$NAMESPACE" || true
            kubectl get pods,services,pvc -n "$NAMESPACE" || true
            exit 1
          fi

      - name: Verify Database Deployment
        run: |
          helm status "$HELM_RELEASE" -n "$NAMESPACE"
          kubectl get pods,services,pvc -n "$NAMESPACE"

      - name: Cleanup Temporary Secret Files
        if: always()
        run: |
          if [[ -n "${SECRET_DIR:-}" && -d "$SECRET_DIR" ]]; then
            rm -rf "$SECRET_DIR"
          fi
