

name: Database CI/CD - EKS

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: Select deployment environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
          - uat
          - prod
      image_tag:
        description: Original DEV image tag for QA, UAT or PROD (example DEV-b625074)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '552940445807'
  ECR_REGISTRY: 552940445807.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY_PREFIX: employee-mgm
  EKS_CLUSTER_NAME: employee-mgm-dev-cluster
  HELM_CHART_PATH: ./employee-management-system
  HELM_RELEASE: employee-management-db

jobs:
  build-dev:
    name: Build and Push DEV Database
    if: inputs.deploy_env == 'dev'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Build and Push Image
        id: build
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY="${ECR_REPOSITORY_PREFIX}-dev-db"
          TAG="DEV-$(git rev-parse --short HEAD)"

          test -f ./db/Dockerfile || {
            echo "ERROR: ./db/Dockerfile not found"
            exit 1
          }

          aws ecr describe-repositories \
            --repository-names "$REPOSITORY"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker build -f ./db/Dockerfile \
            -t "$ECR_REGISTRY/$REPOSITORY:$TAG" ./db

          docker push "$ECR_REGISTRY/$REPOSITORY:$TAG"

          aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$TAG"

          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Built and pushed $ECR_REGISTRY/$REPOSITORY:$TAG"

  promote:
    name: Promote Database Image
    if: inputs.deploy_env != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Validate DEV Image Tag
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_TAG" =~ ^DEV-[A-Za-z0-9._-]+$ ]]; then
            echo "Enter an existing DEV image tag, for example DEV-b625074"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote Through Required Environments
        shell: bash
        env:
          SELECTED_ENV: ${{ inputs.deploy_env }}
          SOURCE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          PREFIX="$ECR_REPOSITORY_PREFIX"
          COMMIT_ID="${SOURCE_TAG#DEV-}"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          promote_image() {
            local source_repo="$1"
            local source_tag="$2"
            local target_repo="$3"
            local target_tag="$4"

            aws ecr describe-images \
              --repository-name "$source_repo" \
              --image-ids "imageTag=$source_tag"

            aws ecr describe-repositories \
              --repository-names "$target_repo"

            docker pull "$ECR_REGISTRY/$source_repo:$source_tag"
            docker tag "$ECR_REGISTRY/$source_repo:$source_tag" \
              "$ECR_REGISTRY/$target_repo:$target_tag"
            docker push "$ECR_REGISTRY/$target_repo:$target_tag"

            aws ecr describe-images \
              --repository-name "$target_repo" \
              --image-ids "imageTag=$target_tag"
          }

          promote_image "${PREFIX}-dev-db" \
            "DEV-$COMMIT_ID" "${PREFIX}-qa-db" "QA-$COMMIT_ID"

          if [[ "$SELECTED_ENV" == "qa" ]]; then
            exit 0
          fi

          promote_image "${PREFIX}-qa-db" \
            "QA-$COMMIT_ID" "${PREFIX}-uat-db" "UAT-$COMMIT_ID"

          if [[ "$SELECTED_ENV" == "uat" ]]; then
            exit 0
          fi

          echo "UAT image is ready. Production promotion requires approval."

  promote-prod:
    name: Approve and Promote to PROD
    needs: promote
    if: inputs.deploy_env == 'prod'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote UAT Image to PROD
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          COMMIT_ID="${SOURCE_TAG#DEV-}"
          SOURCE_REPO="${ECR_REPOSITORY_PREFIX}-uat-db"
          TARGET_REPO="${ECR_REPOSITORY_PREFIX}-prod-db"
          SOURCE_TAG_UAT="UAT-$COMMIT_ID"
          TARGET_TAG="PROD-$COMMIT_ID"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          aws ecr describe-images \
            --repository-name "$SOURCE_REPO" \
            --image-ids "imageTag=$SOURCE_TAG_UAT"

          aws ecr describe-repositories \
            --repository-names "$TARGET_REPO"

          docker pull "$ECR_REGISTRY/$SOURCE_REPO:$SOURCE_TAG_UAT"
          docker tag "$ECR_REGISTRY/$SOURCE_REPO:$SOURCE_TAG_UAT" \
            "$ECR_REGISTRY/$TARGET_REPO:$TARGET_TAG"
          docker push "$ECR_REGISTRY/$TARGET_REPO:$TARGET_TAG"

          aws ecr describe-images \
            --repository-name "$TARGET_REPO" \
            --image-ids "imageTag=$TARGET_TAG"

  deploy:
    name: Deploy Database to EKS
    needs:
      - build-dev
      - promote
      - promote-prod
    if: |
      always() &&
      !cancelled() &&
      (
        (inputs.deploy_env == 'dev' && needs.build-dev.result == 'success') ||
        (inputs.deploy_env == 'qa' && needs.promote.result == 'success') ||
        (inputs.deploy_env == 'uat' && needs.promote.result == 'success') ||
        (inputs.deploy_env == 'prod' && needs.promote-prod.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy Database with Helm
        shell: bash
        env:
          SELECTED_ENV: ${{ inputs.deploy_env }}
          SOURCE_TAG: ${{ inputs.image_tag }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          set -euo pipefail

          ENVIRONMENT="$SELECTED_ENV"
          PREFIX="$ECR_REPOSITORY_PREFIX"
          CHART="$HELM_CHART_PATH"
          RELEASE="$HELM_RELEASE"

          case "$ENVIRONMENT" in
            dev)
              NAMESPACE=dev
              REPOSITORY="${PREFIX}-dev-db"
              TAG="DEV-$(git rev-parse --short HEAD)"
              STORAGE_CLASS_ENABLED=true
              VALUES_FILE="$CHART/values-dev.yaml"
              ;;
            qa|uat|prod)
              if [[ ! "$SOURCE_TAG" =~ ^DEV-[A-Za-z0-9._-]+$ ]]; then
                echo "ERROR: Supply the original DEV image tag"
                exit 1
              fi
              COMMIT_ID="${SOURCE_TAG#DEV-}"
              NAMESPACE="$ENVIRONMENT"
              REPOSITORY="${PREFIX}-${ENVIRONMENT}-db"
              TAG="$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')-$COMMIT_ID"
              STORAGE_CLASS_ENABLED=false
              VALUES_FILE="$CHART/values-${ENVIRONMENT}.yaml"
              ;;
            *)
              echo "Unsupported environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          test -f "$CHART/Chart.yaml"
          test -f "$VALUES_FILE"

          : "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in GitHub environment secrets}"
          : "${MYSQL_USER:?Set MYSQL_USER in GitHub environment secrets}"
          : "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in GitHub environment secrets}"
          : "${MYSQL_DATABASE:?Set MYSQL_DATABASE in GitHub environment secrets}"

          aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$TAG"

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          kubectl get nodes
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          helm lint "$CHART" -f "$VALUES_FILE"

          SECRET_DIR="$(mktemp -d)"
          trap 'rm -rf "$SECRET_DIR"' EXIT

          printf '%s' "$MYSQL_ROOT_PASSWORD" > "$SECRET_DIR/MYSQL_ROOT_PASSWORD"
          printf '%s' "$MYSQL_USER" > "$SECRET_DIR/MYSQL_USER"
          printf '%s' "$MYSQL_PASSWORD" > "$SECRET_DIR/MYSQL_PASSWORD"
          printf '%s' "$MYSQL_DATABASE" > "$SECRET_DIR/MYSQL_DATABASE"

          helm upgrade --install "$RELEASE" "$CHART" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$VALUES_FILE" \
            --set-string components.mysql.image="$ECR_REGISTRY/$REPOSITORY" \
            --set-string components.mysql.tag="$TAG" \
            --set components.mysql.enabled=true \
            --set components.mysql.service.enabled=true \
            --set components.frontend.enabled=false \
            --set components.backend.enabled=false \
            --set ingress.enabled=false \
            --set configMap.enabled=true \
            --set secret.enabled=true \
            --set storageClass.enabled="$STORAGE_CLASS_ENABLED" \
            --set-file secret.stringData.MYSQL_ROOT_PASSWORD="$SECRET_DIR/MYSQL_ROOT_PASSWORD" \
            --set-file secret.stringData.MYSQL_USER="$SECRET_DIR/MYSQL_USER" \
            --set-file secret.stringData.MYSQL_PASSWORD="$SECRET_DIR/MYSQL_PASSWORD" \
            --set-file secret.stringData.MYSQL_DATABASE="$SECRET_DIR/MYSQL_DATABASE" \
            --wait --timeout 10m

          helm status "$RELEASE" -n "$NAMESPACE"
          kubectl get pods,svc,pvc -n "$NAMESPACE" -o wide
          echo "Successfully deployed $ECR_REGISTRY/$REPOSITORY:$TAG to $NAMESPACE"
