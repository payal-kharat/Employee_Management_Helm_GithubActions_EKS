name: Employee Management DB Pipeline

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: Deployment Environment
        type: choice
        required: true
        default: dev
        options:
          - dev
          - qa
          - uat
          - prod
      image_tag:
        description: Original DEV image tag for QA, UAT or PROD (example DEV-b625074)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '020048087135'
  ECR_REGISTRY: 020048087135.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: employee-mgm-dev-cluster
  DEPLOY_ENV: ${{ inputs.deploy_env }}
  HELM_RELEASE: employee-management-db
  HELM_CHART: ./Helm
  VALUES_FILE: ./Helm/values-${{ inputs.deploy_env }}.yaml

jobs:
  build-dev:
    name: Build and Push DB Image
    if: inputs.deploy_env == 'dev'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and Push DEV Image
        id: image
        env:
          ECR_REPOSITORY: employee-mgm-dev-db
        run: |
          IMAGE_TAG="DEV-${GITHUB_SHA::7}"
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" -f ./db/Dockerfile ./db
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Built and pushed ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

  promote-image:
    name: Promote Existing DEV Image
    if: inputs.deploy_env != 'dev'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.promote.outputs.image_tag }}
    steps:
      - name: Validate DEV Image Tag
        env:
          SOURCE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -z "$SOURCE_TAG" ]]; then
            echo "::error::Provide the original DEV image tag, for example DEV-b625074."
            exit 1
          fi
          if [[ ! "$SOURCE_TAG" =~ ^DEV-[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::The image tag must start with DEV-."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Promote DEV Image
        id: promote
        env:
          SOURCE_TAG: ${{ inputs.image_tag }}
        run: |
          SOURCE_REPOSITORY="employee-mgm-dev-db"
          TARGET_REPOSITORY="employee-mgm-${DEPLOY_ENV}-db"
          TAG_SUFFIX="${SOURCE_TAG#DEV-}"
          TARGET_TAG="${DEPLOY_ENV^^}-${TAG_SUFFIX}"

          aws ecr describe-images \
            --repository-name "$SOURCE_REPOSITORY" \
            --image-ids imageTag="$SOURCE_TAG" \
            --region "$AWS_REGION" >/dev/null

          aws ecr describe-repositories \
            --repository-names "$TARGET_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null

          docker pull "${ECR_REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_TAG}"
          docker tag "${ECR_REGISTRY}/${SOURCE_REPOSITORY}:${SOURCE_TAG}" "${ECR_REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"
          docker push "${ECR_REGISTRY}/${TARGET_REPOSITORY}:${TARGET_TAG}"

          echo "image_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "Promoted ${SOURCE_TAG} to ${TARGET_REPOSITORY}:${TARGET_TAG}"

  deploy-db:
    name: Deploy Database to EKS
    runs-on: ubuntu-latest
    needs:
      - build-dev
      - promote-image
    if: >-
      always() &&
      (
        (inputs.deploy_env == 'dev' && needs.build-dev.result == 'success') ||
        (inputs.deploy_env != 'dev' && needs.promote-image.result == 'success')
      )
    environment:
      name: ${{ inputs.deploy_env }}
    env:
      NAMESPACE: ${{ inputs.deploy_env }}
      IMAGE_TAG: ${{ inputs.deploy_env == 'dev' && needs.build-dev.outputs.image_tag || needs.promote-image.outputs.image_tag }}
      ECR_REPOSITORY: employee-mgm-${{ inputs.deploy_env }}-db
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl and Helm
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -fsSL -o kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo install kubectl /usr/local/bin/kubectl
            rm kubectl
          fi

          if ! command -v helm >/dev/null 2>&1; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

          aws --version
          kubectl version --client
          helm version

      - name: Configure EKS Access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"
          kubectl get nodes

      - name: Validate Database Secrets
        run: |
          for SECRET_NAME in MYSQL_ROOT_PASSWORD MYSQL_USER MYSQL_PASSWORD MYSQL_DATABASE; do
            if [[ -z "${!SECRET_NAME:-}" ]]; then
              echo "::error::Required GitHub Actions secret $SECRET_NAME is empty or unavailable."
              exit 1
            fi
          done

      - name: Prepare Temporary Secret Files
        run: |
          SECRET_DIR="$(mktemp -d)"
          chmod 700 "$SECRET_DIR"
          echo "SECRET_DIR=$SECRET_DIR" >> "$GITHUB_ENV"

          for SECRET_NAME in MYSQL_ROOT_PASSWORD MYSQL_USER MYSQL_PASSWORD MYSQL_DATABASE; do
            printf '%s' "${!SECRET_NAME}" > "${SECRET_DIR}/${SECRET_NAME}"
            chmod 600 "${SECRET_DIR}/${SECRET_NAME}"
          done

      - name: Create Target Namespace
        run: |
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Configure StorageClass Management
        id: storage
        run: |
          if [[ "$NAMESPACE" == "qa" ]]; then
            echo "create_storage_class=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_storage_class=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Helm Files
        run: |
          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "::error::Values file not found: $VALUES_FILE"
            exit 1
          fi

          if [[ ! -d "$HELM_CHART/templates" ]]; then
            echo "::error::Helm templates directory not found in $HELM_CHART"
            exit 1
          fi

      - name: Deploy Database with Helm
        env:
          CREATE_STORAGE_CLASS: ${{ steps.storage.outputs.create_storage_class }}
        run: |
          helm upgrade --install "$HELM_RELEASE" "$HELM_CHART" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f "$VALUES_FILE" \
            --set-string components.mysql.image="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
            --set-string components.mysql.tag="$IMAGE_TAG" \
            --set components.mysql.enabled=true \
            --set components.mysql.service.enabled=true \
            --set storageClass.enabled="$CREATE_STORAGE_CLASS" \
            --set-file secret.stringData.MYSQL_ROOT_PASSWORD="${SECRET_DIR}/MYSQL_ROOT_PASSWORD" \
            --set-file secret.stringData.MYSQL_USER="${SECRET_DIR}/MYSQL_USER" \
            --set-file secret.stringData.MYSQL_PASSWORD="${SECRET_DIR}/MYSQL_PASSWORD" \
            --set-file secret.stringData.MYSQL_DATABASE="${SECRET_DIR}/MYSQL_DATABASE" \
            --wait \
            --timeout 10m

      - name: Verify Database Deployment
        run: |
          helm status "$HELM_RELEASE" --namespace "$NAMESPACE"
          kubectl get pods,services,pvc -n "$NAMESPACE"

      - name: Clean Up Temporary Secret Files
        if: always()
        run: |
          if [[ -n "${SECRET_DIR:-}" && -d "$SECRET_DIR" ]]; then
            rm -rf "$SECRET_DIR"
          fi
